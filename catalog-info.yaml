apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: "deed-poll-api"
  description: "Deed poll case management API"
  annotations:
    # This should match folder-name/job-name in Jenkins. Uncomment and fill in once the
    # Jenkins folder for this service exists — the product folder is not yet confirmed.
    # jenkins.io/job-full-name: cft:HMCTS_<product>/deed-poll-api
    github.com/project-slug: 'hmcts/deed-poll-api'
  tags:
    - java
  # Uncomment and fill in once a support channel for this service exists.
  # links:
  #   - url: https://hmcts-reform.slack.com/app_redirect?channel=<channel>
  #     title: <channel> on Slack
  #     icon: chat
spec:
  type: service
  # system: <product> — uncomment once the Backstage system for this product is confirmed.
  lifecycle: experimental
  owner: dcd_deed-poll

