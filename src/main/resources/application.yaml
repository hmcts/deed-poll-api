server:
  port: 4550
  shutdown: "graceful"

management:
  endpoint:
    health:
      # `never` at the endpoint level, because the ungrouped /health is on the unauthenticated
      # allowlist and aggregates *every* registered contributor -- including ones nobody here chose,
      # such as Boot's auto-configured diskSpace, whose details name the pod's absolute filesystem
      # path and its free bytes. DatabaseHealthIndicator exists to keep exactly that class of
      # internal detail off this endpoint, and inheriting `always` would hand it back through
      # whichever contributor a later dependency registers. Both probe groups re-enable details for
      # themselves below, where the include list is closed and so what can be published is reviewable.
      show-details: "never"
      # Enabled explicitly rather than relying on Boot's "am I in Kubernetes" auto-detection, so
      # /health/liveness and /health/readiness exist in every environment. A probe that only exists
      # in the cluster is a probe nobody can try before deploying.
      probes:
        enabled: true
      group:
        # Should traffic come to this pod? `db` is DatabaseHealthIndicator's connection check and
        # `deedPollSchema` is DeedPollSchemaHealthIndicator: a connection alone passes against an unmigrated
        # database,
        # where every request would 500 while the probe stayed green. `readinessState` is Boot's own,
        # and is what turns the probe DOWN during graceful shutdown so the pod leaves the service
        # before it stops accepting requests.
        readiness:
          include: "readinessState,db,deedPollSchema"
          # The missing table names are the point -- see DeedPollSchemaHealthIndicator. Stated here
          # rather than inherited, because a group that quietly stopped showing details would answer
          # a bare DOWN and lose the diagnosis.
          show-details: "always"
        # Should this process be killed? Deliberately nothing but the process itself. A database blip
        # must not restart every pod: restarting cannot fix someone else's database, and it destroys
        # the replicas that would have recovered when the database came back.
        liveness:
          include: "livenessState"
          # Stated for the same reason as readiness, and safe for the same reason: the include list is
          # closed, and `livenessState` is a bare UP/DOWN with nothing internal in it. What the details
          # buy is that the group's *contents* are visible, so a check put in the wrong group is
          # something a caller -- and livenessHasNothingInItButTheProcess -- can see rather than infer.
          show-details: "always"
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, info, prometheus
  health:
    # Boot's own `db` contributor is replaced by DatabaseHealthIndicator, which asks the same
    # question and answers it without publishing the driver's message. See that class: the readiness
    # group runs with show-details always and is on the unauthenticated allowlist, and a JDBC error
    # names the host, database and user. Disabled here rather than excluded from the group, because
    # the group still wants a `db` answer -- just not that one.
    db:
      enabled: false
    # service-auth-provider-java-client contributes a health indicator that calls S2S. Nothing here
    # calls another CFT service yet, so the only thing it could report is the availability of a
    # dependency this service does not have -- and it would page somebody for it.
    serviceAuth:
      enabled: false

springdoc:
  # `api` rather than the four controller packages under it, so a namespace added later -- or a
  # controller put in a sub-package nobody thought to list -- is documented by being where it belongs
  # instead of by somebody remembering this line. The template's `controllers` package is the
  # Always-On root endpoint, which is infrastructure rather than API but costs nothing to publish.
  packagesToScan: uk.gov.hmcts.reform.deedpoll.controllers, uk.gov.hmcts.reform.deedpoll.api
  writer-with-order-by-keys: true

spring:
  config:
    # Where the CNP java chart mounts the `deed-poll-{env}` vault -- `charts/deed-poll-api/values.yaml`
    # keys its `keyVaults` block on `deed-poll`, and the mount path follows that key. `optional:` so a
    # local run, where nothing is mounted, starts rather than failing on a missing directory.
    import: "optional:configtree:/mnt/secrets/deed-poll/"
  application:
    name: deed-poll-api
  datasource:
    driver-class-name: org.postgresql.Driver
    # Defaults point at the docker-compose database in docker-compose.yml, published on
    # 5433 to avoid the sibling deed-poll-admin stack's 5432. The password default is
    # empty on purpose: no credential is committed, and a deployed environment that
    # forgets to supply DB_PASSWORD fails to connect rather than connecting as something
    # unintended.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:deedpoll}${DB_OPTIONS:}
    username: ${DB_USER_NAME:deedpoll}
    password: ${DB_PASSWORD:}
    properties:
      charSet: UTF-8
    hikari:
      minimumIdle: ${DB_POOL_MIN_IDLE:2}
      maximumPoolSize: ${DB_POOL_MAX_SIZE:10}
      idleTimeout: 10000
      poolName: DeedPollHikariCP
      maxLifetime: 7200000
      connectionTimeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks that the entities agree with it, and the
      # application refuses to start if they do not -- the same assertion EntityMappingTest makes,
      # made again in every environment.
      ddl-auto: validate
      naming:
        # Verbatim names, not Spring Boot's camelCase-to-snake_case default. The ported columns are
        # mixed case ("newForename") because the reference schema's are, and the default strategy
        # would rewrite them to new_forename and stop finding them.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        # Quote every identifier, so the mixed-case column names survive: unquoted, Postgres folds
        # them to lower case. Table names are all lower case, so quoting them changes nothing.
        globally_quoted_identifiers: true
    # A caseworker request must not hold a database connection open for the whole of view
    # rendering; every fetch the response needs is done in the service layer.
    open-in-view: false

idam:
  api:
    # The IDAM issuer a forwarded access token must come from. Empty by default, so an environment
    # that has not been given one refuses every token rather than trusting an issuer nobody chose.
    # Endpoints are discovered from it, never configured: this was written without access to a real
    # CFT IDAM, so any hardcoded path would be a guess.
    issuer-url: ${IDAM_API_ISSUER_URL:}
    # Which `aud` values are ours. IDAM signs the whole estate's tokens with one key set, so a
    # signature alone only proves "some IDAM token"; the audience check is what stops a token minted
    # for another service being replayed here. Comma-separated because it arrives from a Helm env
    # map, where a list would have to be JSON-encoded into a string. Empty means every token is
    # refused -- an unset value must not be the permissive case.
    audiences: ${IDAM_API_AUDIENCES:}
  s2s-auth:
    # Outbound service-to-service tokens. Configured but unused in plan 01: nothing here calls
    # another CFT service. The secret has no default, so a deployed environment that has not been
    # given one cannot mint a token that would be refused anyway.
    url: ${IDAM_S2S_AUTH_URL:http://localhost:4502}
    totp-secret: ${DEED_POLL_API_S2S_SECRET:}
    microservice: ${S2S_SERVICE_NAME:deed_poll_api}

notify:
  # GOV.UK Notify. No Notify service exists for deed poll yet -- no API key, no templates, no template IDs --
  # so everything here is either the real public endpoint or a placeholder, and nothing can send until
  # notify-0 provisions them. See NotifyProperties.
  #
  # The real base URL as the default, because that is where every provisioned environment points; a test
  # overrides it to StubNotify. Harmless while the key is empty: nothing can be sent without one.
  api-url: ${NOTIFY_API_URL:https://api.notifications.service.gov.uk}
  # A secret, with no working default, for the reason idam.s2s-auth.totp-secret has none. It is not in the
  # `deed-poll` vault yet, which is why charts/deed-poll-api/values.yaml names no Notify secret -- a chart
  # naming a secret the vault does not hold fails to deploy. notify-0 adds both ends together.
  api-key: ${NOTIFY_API_KEY:}
  # The reply-to address id for the emails whose words ask the applicant to reply -- today
  # request-confirmation-to-proceed, which asks whether they still want the deed enrolled, and
  # chase-missing-documents, which asks them to send what is missing. One id for the service, because there is one
  # monitored inbox and a second would be a second thing for somebody to watch. Not a secret: it
  # identifies an address the recipient reads on the email itself, so it is an environment variable rather than a
  # vault entry, and notify-0 supplies it with the template UUIDs. Unset, a template that invites a reply reports
  # itself unprovisioned and the drain refuses to send it -- deliberately, because Notify drops a blank reply-to
  # and sends from no-reply, which loses the answer and says nothing. See NotifyProperties.isProvisioned.
  email-reply-to-id: ${NOTIFY_EMAIL_REPLY_TO_ID:}
  # How many weeks Notify keeps a document this service sends available for download. NO WORKING DEFAULT, and
  # that is the same decision api-key above carries rather than an omission: an applicant who has to print a
  # deed, gather two witnesses and find a commissioner of oaths is not doing it in a week, and the number is a
  # business decision -- so a plausible guess committed here would silently become the number every environment
  # ran on. Unset (or not positive), NotifyProperties.isProvisioned reports every template that carries a
  # document as unprovisioned and the drain refuses to send it, exactly as it does for a missing reply-to. That
  # is the two forms-for-completion emails, which are the only templates that carry one. notify-0 chooses the
  # number; weeks because that is the unit Notify documents the retention period in.
  document-retention-weeks: ${NOTIFY_DOCUMENT_RETENTION_WEEKS:}
  templates:
    # The Notify template UUID, which differs per environment and so is configuration rather than a constant
    # in Java. DEED_POLL_PLACEHOLDER is the same literal deedpoll.ccd.case-type-id uses, so one grep lists
    # every external identifier this service is still waiting on. With it set, Notify answers a preview with
    # 400 and a send with 403 -- both permanent, which is the correct answer to "this template does not exist".
    application-rejected: ${NOTIFY_TEMPLATE_APPLICATION_REJECTED:DEED_POLL_PLACEHOLDER}
    # Listed for the same reason, so an environment can point it at a real template without a code change. Absent
    # from this map the placeholder is what NotifyProperties.templateId answers anyway, but the environment
    # variable would then be one nobody reads.
    request-confirmation-to-proceed: ${NOTIFY_TEMPLATE_REQUEST_CONFIRMATION_TO_PROCEED:DEED_POLL_PLACEHOLDER}
    # The chase for missing documents, which is provisioned: notify-6's Task 0 read template
    # a67e7dd1-0f8c-4366-a1de-ca5fbc24ec98 (version 1, non-prod) back out of Notify on 2026-09-24 and confirmed
    # its five placeholders character for character. The UUID still belongs in the environment rather than here --
    # it differs per Notify service -- and the variable name is the one the non-prod env file already exports, so a
    # plausible-looking respelling would leave a local run silently unprovisioned. This template invites a reply,
    # so it also needs NOTIFY_EMAIL_REPLY_TO_ID above: without it NotifyProperties.isProvisioned reports it
    # unprovisioned rather than letting Notify send it from an address nobody reads. charts/deed-poll-api sets
    # BOTH ids, so ⑤ reads provisioned in AAT -- this comment used to say it set neither, which was true before
    # the chart's own CORRECTED 2026-09-25 block. What AAT still lacks is the Notify API key, which
    # isProvisioned deliberately does not read: the template is offered and every send fails terminally with
    # "Empty key" until azure-access#8111 lets the secret be written. The chart says the whole of that.
    chase-missing-documents: ${NOTIFY_TEMPLATE_CHASE_MISSING_DOCUMENTS:DEED_POLL_PLACEHOLDER}
    # The two forms-for-completion emails, ① and ②, which carry the generated deed. Neither has been authored in
    # Notify yet -- the content draft is deed-poll-admin's .business_context/notify-templates/forms-for-completion.md
    # -- so both stay on the placeholder and read unprovisioned, which is what the Email tab should say rather than
    # offering a send that cannot render. They are listed here all the same, for the reason
    # request-confirmation-to-proceed is: absent from this map the placeholder is what templateId answers anyway,
    # but the environment variable would then be one nobody reads. Both invite a reply (their words say "you can
    # reply to this email"), so each also needs NOTIFY_EMAIL_REPLY_TO_ID above, and both carry a document, so each
    # also needs document-retention-weeks -- three things, and isProvisioned asks for all three.
    forms-for-completion-adult: ${NOTIFY_TEMPLATE_FORMS_FOR_COMPLETION_ADULT:DEED_POLL_PLACEHOLDER}
    forms-for-completion-minor: ${NOTIFY_TEMPLATE_FORMS_FOR_COMPLETION_MINOR:DEED_POLL_PLACEHOLDER}

deedpoll:
  ccd:
    # The one place a CCD case type is named, and deliberately not the real value: the case type and
    # jurisdiction have not been onboarded, so anything else here would be a guess that plan 02 would
    # then have to find and unpick. Nothing reads it yet -- it exists so no task has to invent one.
    case-type-id: DEED_POLL_PLACEHOLDER
  referrals:
    # How long a judge's claim on a referral survives their inactivity before it goes back into the
    # shared pool. Measured from their last interaction with the referral, not from the claim, so a
    # judge still reading the papers keeps it.
    #
    # Two hours is a guess about how judges will actually work -- long enough not to lose a referral
    # while reading a case, short enough that a closed laptop does not hold one overnight. Tunable
    # here, as an ISO-8601 duration, once there is real judicial behaviour to observe: PT30M, PT4H.
    # A zero or negative value refuses to start rather than releasing every claim as it is made.
    claim-expiry: ${DEEDPOLL_REFERRAL_CLAIM_EXPIRY:PT2H}
  documents:
    # Where LocalFilesystemDocumentStore keeps uploaded blobs. Development only: local disk does
    # not survive AKS, because pods are ephemeral and replicas do not share a volume. Real
    # storage is CDAM, in plan 03, which adds an implementation beside the local one.
    local-store-root: ${DOCUMENT_STORE_ROOT:data/documents}

azure:
  application-insights:
    # The connection string, not an instrumentation key: keys are deprecated, and
    # `app-insights-connection-string` is the secret the shared root in `hmcts/deed-poll-infra` writes.
    # It arrives as a file under the vault mount above, which the configtree import turns into a
    # property of the same name. What actually sends telemetry is the agent, reading the same secret
    # directly through `lib/applicationinsights.json`; this property is what in-process telemetry would
    # bind to. Empty by default, so a local run reports nowhere rather than into a real workspace.
    connection-string: ${app-insights-connection-string:}
