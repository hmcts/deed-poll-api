server:
  port: 4550
  shutdown: "graceful"

# If you use a database then uncomment the `group:, readiness: and include: "db"` lines in the health probes and uncomment the datasource section
management:
  endpoint:
    health:
      show-details: "always"
      # group:
      #  readiness:
      #   include: "db"
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, info, prometheus

springdoc:
  packagesToScan: uk.gov.hmcts.reform.deedpoll.controllers
  writer-with-order-by-keys: true

spring:
  config:
    import: "optional:configtree:/mnt/secrets/rpe/"
  application:
    name: deed-poll-api
  datasource:
    driver-class-name: org.postgresql.Driver
    # Defaults point at the docker-compose database in docker-compose.yml, published on
    # 5433 to avoid the sibling deed-poll-admin stack's 5432. The password default is
    # empty on purpose: no credential is committed, and a deployed environment that
    # forgets to supply DB_PASSWORD fails to connect rather than connecting as something
    # unintended.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:deedpoll}${DB_OPTIONS:}
    username: ${DB_USER_NAME:deedpoll}
    password: ${DB_PASSWORD:}
    properties:
      charSet: UTF-8
    hikari:
      minimumIdle: ${DB_POOL_MIN_IDLE:2}
      maximumPoolSize: ${DB_POOL_MAX_SIZE:10}
      idleTimeout: 10000
      poolName: DeedPollHikariCP
      maxLifetime: 7200000
      connectionTimeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks that the entities agree with it, and the
      # application refuses to start if they do not -- the same assertion EntityMappingTest makes,
      # made again in every environment.
      ddl-auto: validate
      naming:
        # Verbatim names, not Spring Boot's camelCase-to-snake_case default. The ported columns are
        # mixed case ("newForename") because the reference schema's are, and the default strategy
        # would rewrite them to new_forename and stop finding them.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        # Quote every identifier, so the mixed-case column names survive: unquoted, Postgres folds
        # them to lower case. Table names are all lower case, so quoting them changes nothing.
        globally_quoted_identifiers: true
    # A caseworker request must not hold a database connection open for the whole of view
    # rendering; every fetch the response needs is done in the service layer.
    open-in-view: false

deedpoll:
  documents:
    # Where LocalFilesystemDocumentStore keeps uploaded blobs. Development only: local disk does
    # not survive AKS, because pods are ephemeral and replicas do not share a volume. Real
    # storage is CDAM, in plan 03, which adds an implementation beside the local one.
    local-store-root: ${DOCUMENT_STORE_ROOT:data/documents}

azure:
  application-insights:
    instrumentation-key: ${rpe.AppInsightsInstrumentationKey:00000000-0000-0000-0000-000000000000}
