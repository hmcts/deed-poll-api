name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          # 21, matching the toolchain build.gradle pins. On 17 Gradle would look for a 21 JDK it has no
          # resolver configured to download, and the build would fail before compiling anything.
          java-version: '21'
          cache: 'gradle'
      - name: Build
        run: ./gradlew check
