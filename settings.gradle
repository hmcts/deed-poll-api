/*
  The hmcts.ccd.sdk plugin is published to the HMCTS Azure Artifacts feed, not the Gradle Plugin Portal,
  so the feed is listed here as pcs-api lists it. The portal stays first for every other plugin.
*/
pluginManagement {
  repositories {
    gradlePluginPortal()
    maven {
      url = 'https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1'
    }
  }
}

rootProject.name = 'deed-poll-api'
