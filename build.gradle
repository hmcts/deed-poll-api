plugins {
  id 'application'
  id 'jacoco'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.springframework.boot' version '3.5.16'
  id 'com.github.ben-manes.versions' version '0.52.0'
  id 'org.sonarqube' version '6.3.1.5724'
  /*
    Applies analysis tools including checkstyle and OWASP Dependency checker.
    See https://github.com/hmcts/gradle-java-plugin
 */
  id 'uk.gov.hmcts.java' version '0.12.70'

  /*
    The CCD SDK, pinned to the version pcs-api runs on this Boot and Java (plan 02, decision 2). Its BOM
    versions decentralised-runtime, which is why that dependency below carries no version of its own.
  */
  id 'hmcts.ccd.sdk' version '7.1.0'
  /*
    The in-process CFT stack -- CCD data, definition and user-profile stores, AM, and the IDAM and S2S simulators
    -- that `cftlibTest` runs the linking operation against. Pinned as pcs-api pins it. Local only: nothing in
    `build`, `check` or the Jenkinsfile runs `cftlibTest` (plan 02, Task 8).
  */
  id 'com.github.hmcts.rse-cft-lib' version '0.19.2377'
}

application {
  mainClass = 'uk.gov.hmcts.reform.deedpoll.Application'
  group = 'uk.gov.hmcts.reform'
  version = '0.0.1'
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

ccd {
  configDir = file('build/definitions')
}

/*
  The SDK's generator boots the whole application to find its CCDConfig beans. `config-gen`
  (src/main/resources/application-config-gen.yaml) boots it with Flyway off and nothing that opens a database
  connection, so generating a definition needs no Postgres. There is no scheduler to switch off: this service
  has none. Set here rather than left to the environment, as pcs-api sets it.
*/
tasks.named('generateCCDConfig') {
  environment 'SPRING_PROFILES_ACTIVE', 'config-gen'
}

def configureSourceSet(String name) {
  sourceSets.create(name) { sourceSet ->
    sourceSet.java {
      compileClasspath += sourceSets.main.output + sourceSets.test.output
      runtimeClasspath += sourceSets.main.output + sourceSets.test.output
      srcDir "src/${name}/java"
    }
    sourceSet.resources.srcDir "src/${name}/resources"
  }
}

['smokeTest', 'integrationTest', 'functionalTest'].each { configureSourceSet(it) }

configurations {
  functionalTestImplementation.extendsFrom testImplementation
  functionalTestRuntimeOnly.extendsFrom runtimeOnly

  integrationTestImplementation.extendsFrom testImplementation
  integrationTestRuntimeOnly.extendsFrom runtimeOnly

  smokeTestImplementation.extendsFrom testImplementation
  smokeTestRuntimeOnly.extendsFrom runtimeOnly

  // The plugin's own cftlibTest configurations extend `implementation` only, as pcs-api found.
  cftlibTestImplementation.extendsFrom testImplementation
}

tasks.withType(JavaCompile).configureEach {
  options.compilerArgs << "-Xlint:unchecked" << "-Werror"
}

// https://github.com/gradle/gradle/issues/16791
tasks.withType(JavaExec).configureEach {
  javaLauncher.set(javaToolchains.launcherFor(java.toolchain))
}

// Testcontainers needs a Docker daemon, and the CNP Jenkins VM agent has none: `POSTGRES.start()`
// throws in a static initialiser and every context-booting test fails with it (PR-15/1, 2026-09-15).
// Unset means enabled, so a local `./gradlew check` still runs them and a developer sees a real
// failure. `Jenkinsfile_CNP` sets it false. See docs/plans for the cost this accepts.
//
// Declared here, above the `test` block and `tasks.check.dependsOn(integration)` that both read it,
// because Groovy evaluates this file top to bottom: a `Test` task configured above the definition
// would not see it.
def integrationTestsEnabled = System.getenv('INTEGRATION_TESTS_ENABLED') != 'false'

tasks.withType(Test).configureEach {
  useJUnitPlatform()

  testLogging {
    exceptionFormat = 'full'
  }
}

test {
  useJUnitPlatform {
    // The CNP VM agent has no Docker daemon. 32 src/test classes need Testcontainers -- 31 inherit
    // the tag from AbstractPostgresContainerTest, SchemaConformanceTest carries it directly -- and
    // they account for 953 of the 2,610 tests (measured, 2026-09-24 after the email case notes and their
    // review pass, leaving 1,657 Docker-free tests. That work added no container-backed class: of its 30
    // tests, 23 are container-free -- EmailNotesTest, CaseEmailServiceTest$Sending$CaseNote and
    // NotificationOutboxTest$CaseNote, which is where the rule that a note the notes service refuses rolls
    // back rows Notify has already accepted is stated -- and 7 are nested in CaseworkerEmailControllerTest,
    // which already carries the tag. The preceding total was measured as 2,576 on notify-3b and read 2,580
    // by the time this branch started, the four between being the Notify API-key and boolean fixes;
    // it was 946 of 2,576 across the same 32 classes leaving 1,630 after notify-3b's third review pass,
    // which added the 32nd class, ConfirmationConcurrencyTest:
    // notify-3b's earlier passes added none, so this figure is the one the plan asked to be re-measured
    // if the work ever did -- it proves the recording's idempotency-by-refusal and the referral lock's
    // refresh against two real transactions, which no fake can stand in for, so it cannot be made
    // container-free the way the rest of this plan's assertions were;
    // it was 936 of 2,563 across 31 classes leaving 1,627 after the second pass, which added four
    // container-free tests: the refusal of a second confirmation email once the applicant has answered,
    // stated on both the availability and the send path, and the judicial timeline's reach over the
    // confirmation note; it was 936 of 2,559 leaving 1,623 after the first pass, whose confirmation
    // columns, recording refusals, days-waiting arithmetic and whole security and scoping statement are
    // container-free by design, with their container-backed assertions nested in
    // CaseworkerReferralControllerTest and CaseworkerEmailControllerTest, which already carry the tag;
    // it was 935 of 2,554 after task 4, before the review added four container-free tests and the
    // pg_indexes assertion for V17's case-side index to EntityMappingTest);
    // it was 900 of 2,444 after notify-3 task 3, which added none of its own: its container-backed
    // assertions extend NotificationRepositoryTest and CaseworkerEmailControllerTest, and the 31st class
    // is ReferralLifecycleTimelineTest, which arrived with the referral lifecycle work in between;
    // it was 868 of 2,292 after notify-5 task 4, which
    // extends CaseworkerEmailControllerTest with the send-drain-read correspondence chain while
    // leaving 1,424 Docker-free tests; it was 867 of 2,282 after notify-1 task 7, which extended
    // NotificationRepositoryTest with the permanent-versus-uncertain resend boundary; it was 866 of
    // 2,281 after task 6, which added the 30th
    // class: NotificationOutboxConcurrencyTest, proving two real transactions send one row once; it
    // was 865 of 2,276 after task 5, whose sender tests are container-free and whose HTTP send-outcome
    // tests extend the existing CaseworkerEmailControllerTest; it was 860 of 2,267 after
    // task 4, which added the 29th class: CaseworkerEmailControllerTest, where the three email routes
    // are asserted over real HTTP against a real Postgres and a stub Notify; task 3 added no
    // container-backed class and task 2 added the 28th, NotificationRepositoryTest, where the outbox's
    // conditional claim is proved exclusive against a real Postgres; it was 831 of 2,218 across 28
    // classes after task 3, 821 of 2,098 across 27 after the judicial-surface plan, 773 of 1,975 across
    // 26 after the currentReferralState plan, 741 of 1,813 after the referrals plan, 701 of 1,688
    // across 23 before it, and 609 of 1,488 across 22 on 2026-09-15. Excluding them keeps the other 1,657
    // running in CI -- the judicial role gate, the visibility rule, the notification outbox's whole
    // state machine, the case notes an email writes and the email operations' own rules among them, each
    // stated container-free for that reason -- instead of losing the whole suite to a static initialiser.
    // Re-measure rather than trusting these figures: they move whenever a container-backed class is
    // added, and the total moves whenever anything is. Unset means exclude nothing, so a local run is
    // unchanged.
    // STOPGAP: delete this when a Docker-capable agent exists.
    if (!integrationTestsEnabled) {
      excludeTags 'requires-docker'
    }
  }

  // Gradle's default of 512m no longer fits one worker's cached Spring contexts plus ArchUnit's class
  // import: V24's tests tipped it into "Java heap space" in NotificationSecurityTest on two consecutive
  // runs (2026-09-28), with 3,290 tests passing on the commit before.
  maxHeapSize = '1g'
}

tasks.register('functional', Test) {
  description = "Runs functional tests"
  group = "Verification"
  testClassesDirs = sourceSets.functionalTest.output.classesDirs
  classpath = sourceSets.functionalTest.runtimeClasspath
}

tasks.register('integration', Test) {
  description = "Runs integration tests"
  group = "Verification"
  testClassesDirs = sourceSets.integrationTest.output.classesDirs
  classpath = sourceSets.integrationTest.runtimeClasspath
  /*
    Kept here and NOT on `test`. An integration test that fails has usually taken a container with it,
    so the remaining ones are reporting the same fault at length. A unit run is the opposite: aborting
    on the first failure reports one broken test for a change that broke a whole area, which is slower
    to diagnose than reading the full list.
  */
  failFast = true
}

tasks.register('smoke', Test) {
  description = "Runs Smoke Tests"
  group = "Verification"
  testClassesDirs = sourceSets.smokeTest.output.classesDirs
  classpath = sourceSets.smokeTest.runtimeClasspath
}

/*
  The in-process CFT stack. Every service it starts shares this JVM and so this environment, which is why only the
  settings data-store and the bootstrapper read are here. This service's own are in src/cftlib/resources'
  application-cftlib.yaml, where no other service can pick them up. Local simulators throughout: cftlib stubs outbound
  S2S and IDAM token requests, and parses inbound tokens without checking signatures.
*/
tasks.withType(uk.gov.hmcts.rse.CftlibExec).configureEach {
  authMode = uk.gov.hmcts.rse.AuthMode.Local
  environment 'RSE_LIB_ADDITIONAL_DATABASES', 'deedpoll'
  /*
    Data-store routes a case type to its persistence host by case-insensitive *prefix* of the case type id. The key is
    `DEED` rather than the whole placeholder because Spring reads each underscore in an environment variable's name
    as a property separator, so `..._DEED_POLL_PLACEHOLDER` would bind as `deed.poll.placeholder` and match nothing.
  */
  environment 'CCD_DECENTRALISED_CASE-TYPE-SERVICE-URLS_DEED', 'http://localhost:4550'
  // Data-store's own default list, plus this service, which calls it as the linking operation.
  environment 'DATA_STORE_S2S_AUTHORISED_SERVICES',
    'ccd_gw,ccd_data,xui_webapp,aac_manage_case_assignment,ccd_case_document_am_api,am_role_assignment_service,deed_poll_api'
}

// Gradle's checkstyle plugin hangs every source set's task on `check`, which would compile the plugin's cftlib,
// cftlibIDE and cftlibTest sets in every build. Left out so `build` is what it was; `checkstyleCftlibTest` still runs
// by name.
checkstyle {
  sourceSets = project.sourceSets.matching { !it.name.startsWith('cftlib') }
}

jacocoTestReport {
  executionData(test, integration)
  reports {
    xml.getRequired().set(true)
    csv.getRequired().set(false)
    html.getRequired().set(true)
  }
}

tasks.sonarqube.dependsOn(jacocoTestReport)

// `integrationTestsEnabled` is defined above the `test` block, which reads it too.
if (integrationTestsEnabled) {
  tasks.check.dependsOn(integration)
}

sonarqube {
  properties {
    property "sonar.projectName", "Reform :: deed-poll-api"
    property "sonar.projectKey", "uk.gov.hmcts.reform:deed-poll-api"
  }
}

// before committing a change, make sure task still works
dependencyUpdates {
  def isNonStable = { String version ->
    def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { qualifier -> version.toUpperCase().contains(qualifier) }
    def regex = /^[0-9,.v-]+$/
    return !stableKeyword && !(version ==~ regex)
  }
  rejectVersionIf { selection -> // <---- notice how the closure argument is named
    return isNonStable(selection.candidate.version) && !isNonStable(selection.currentVersion)
  }
}

// https://jeremylong.github.io/DependencyCheck/dependency-check-gradle/configuration.html
dependencyCheck {
  suppressionFile = 'config/owasp/suppressions.xml'
}

repositories {
  mavenLocal()
  mavenCentral()
  maven {
    url = uri('https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1')
  }
}

ext {
  log4JVersion = "2.25.1"
  logbackVersion = "1.5.18"
}

ext['snakeyaml.version'] = '2.0'
ext['httpclient5.version'] = '5.6.4'
ext['httpcore5.version'] = '5.4.3'

dependencies {
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-web'
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-actuator'
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-aop'
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-json'
  // Brings spring-boot-starter-jdbc with it, so the JDBC starter is no longer declared
  // separately. Hibernate is configured with ddl-auto=validate: Flyway owns the schema and
  // the entities are checked against it, never the other way round.
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-data-jpa'
  implementation group: 'org.springdoc', name: 'springdoc-openapi-starter-webmvc-ui', version: '2.8.17'

  /*
    Authentication. The resource-server starter brings spring-security-oauth2-jose (Nimbus), which
    is what validates a forwarded IDAM access token's signature against the issuer's JWKS.
  */
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-security'
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-oauth2-resource-server'

  /*
    Outbound service-to-service tokens, pinned as pcs-api pins it. Configured but unused in plan 01:
    nothing here calls another CFT service yet, and the secret has a non-working default so a
    misconfigured environment cannot mint anything.
  */
  implementation group: 'com.github.hmcts', name: 'service-auth-provider-java-client', version: '5.3.5'
  /*
    service-auth-provider-java-client declares no transitive dependencies: its
    ServiceAuthorisationApi is a @FeignClient, and the client bean only exists if Spring Cloud
    OpenFeign is on the classpath to build it. Version pinned as pcs-api pins it.
  */
  implementation group: 'org.springframework.cloud', name: 'spring-cloud-starter-openfeign', version: '4.3.3'

  /*
    GOV.UK Notify. Pinned as pcs-api pins it (`apps/pcs/pcs-api/build.gradle:437`); `apps/pcs/CLAUDE.md`
    says 6.0.0 and is stale. Nothing sends yet: there is no Notify service for deed poll, so the API key
    and the template IDs are placeholders and every test talks to StubNotify. See docs/plans/notify-1.
  */
  implementation group: 'uk.gov.service.notify', name: 'notifications-java-client', version: '6.2.0-RELEASE'

  /*
    The decentralised CCD runtime: the /ccd-persistence API data-store calls back into, and the `ccd`-schema
    migrations it runs before ours. No version -- the hmcts.ccd.sdk plugin's BOM supplies it. Deliberately
    alone: no ccd-runtime-indexing, because nothing here searches CCD, and no ccd-servicebus-support (plan 02,
    decisions 3 and 4).
  */
  implementation 'com.github.hmcts:decentralised-runtime'
  /*
    Already on the runtime classpath through decentralised-runtime, at this version. Declared because
    CcdConfiguration names its IdamApi in @EnableFeignClients -- the SDK's IdamService cannot wire without it --
    and the SDK's BOM does not manage it. Pinned as pcs-api pins it, so the declaration changes nothing resolved.
  */
  implementation group: 'com.github.hmcts', name: 'idam-java-client', version: '3.0.5'

  implementation group: 'org.flywaydb', name: 'flyway-core'
  runtimeOnly group: 'org.flywaydb', name: 'flyway-database-postgresql'
  runtimeOnly group: 'org.postgresql', name: 'postgresql'

  implementation group: 'com.github.hmcts.java-logging', name: 'logging', version: '8.0.0'

  /*
    Accessors only, on the entities. The case entity has over a hundred mapped columns and
    hand-written getters would bury the mapping this task exists to make readable. Version comes
    from the Spring Boot BOM, as in pcs-api.
  */
  compileOnly group: 'org.projectlombok', name: 'lombok'
  annotationProcessor group: 'org.projectlombok', name: 'lombok'

  implementation group: 'org.apache.logging.log4j', name: 'log4j-api', version: log4JVersion
  implementation group: 'org.apache.logging.log4j', name: 'log4j-to-slf4j', version: log4JVersion
  implementation group: 'ch.qos.logback', name: 'logback-classic', version: logbackVersion
  implementation group: 'ch.qos.logback', name: 'logback-core', version: logbackVersion

  testImplementation group: 'org.springframework.boot', name: 'spring-boot-starter-test'
  testImplementation group: 'org.springframework.security', name: 'spring-security-test'
  testImplementation group: 'io.rest-assured', name: 'rest-assured', version: '5.5.7'

  /*
    A stub IDAM. Nothing in the suite talks to a real issuer: there are no credentials, and a test
    that needed them would be one nobody could run.
  */
  testImplementation group: 'org.wiremock', name: 'wiremock-standalone', version: '3.13.2'

  /*
    Architecture assertions -- the caseworker and citizen namespaces sharing no DTO is a rule about
    dependencies between packages, which is a thing to assert rather than to remember.
  */
  testImplementation group: 'com.tngtech.archunit', name: 'archunit-junit5', version: '1.4.1'

  /*
    Every test that needs a database starts a throwaway Postgres. Nothing in the suite
    talks to a developer's local database or to a deployed one.
  */
  testImplementation group: 'org.testcontainers', name: 'postgresql'
  testImplementation group: 'org.testcontainers', name: 'junit-jupiter'
  testRuntimeOnly group: 'org.flywaydb', name: 'flyway-database-postgresql'
  testRuntimeOnly group: 'org.postgresql', name: 'postgresql'
}

bootJar {
  archiveFileName = "deed-poll-api.jar"

  manifest {
    attributes('Implementation-Version': project.version.toString())
  }
}

// Gradle 7.x issue, workaround from: https://github.com/gradle/gradle/issues/17236#issuecomment-894768083
rootProject.tasks.named("processSmokeTestResources") {
  duplicatesStrategy = 'include'
}

wrapper {
    distributionType = Wrapper.DistributionType.ALL
}
